name: Lumina Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Lumina APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/lumina-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "KEYSTORE_BASE64 secret not set; using debug signing fallback."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/Lumina-v1.0.0-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/Lumina-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/Lumina-v1.0.0-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/Lumina-release.apk
          fi

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/Lumina-v1.0.0-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/Lumina-debug.apk
          fi
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Debug-APK
          path: release_assets/Lumina-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumina-Release-APK
          path: release_assets/Lumina-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "Lumina ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          body: |
            ## Lumina v1.0.0 — Adaptive Liquid Glass Reminders

            100% local-first, FOSS (GPL-3.0) Android reminders app built with Jetpack Compose, live Haze backdrop blur, Room persistence, exact alarms, and a frosted home screen widget.

            ### Highlights
            - **Adaptive Liquid Glass UI**: Dark Obsidian & Light Crystal frosted surfaces with specular rims, live backdrop blur (`dev.chrisbanes.haze`), and 4 ambient mesh palettes.
            - **Smart Lists & Custom Lists**: Today, Scheduled, Flagged, All, Completed, plus customizable color/icon lists.
            - **Natural-Language Quick-Add**: Live parsing for dates, times, priorities (`!`, `!!`, `!!!`), flags (`#flag`), and recurrence (`daily`, `every weekday`, `every 3 days`).
            - **Exact Alarms & Actionable Alerts**: `AlarmManager` scheduling with `Done`, `Snooze 15m`, and `Snooze 1h` notification actions plus reboot rescheduling.
            - **Frosted Home Widget**: Resizable 4x2 DayNight glass widget with 1-tap completion and quick add.
            - **Offline Backup**: Schema-versioned JSON export and import via Android Storage Access Framework.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
