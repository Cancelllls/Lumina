name: Lumina Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Lumina APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/lumina-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "KEYSTORE_BASE64 secret not set; using debug signing fallback."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/Lumina-v1.1.0-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/Lumina-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/Lumina-v1.1.0-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/Lumina-release.apk
          fi

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/Lumina-v1.1.0-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/Lumina-debug.apk
          fi
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Debug-APK
          path: release_assets/Lumina-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumina-Release-APK
          path: release_assets/Lumina-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          name: "Lumina ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}"
          draft: false
          prerelease: false
          body: |
            ## Lumina v1.1.0 — BitChord Liquid Glass & Modern Android Stack

            Upgraded to **JDK 21 LTS**, **Gradle 9.1.0**, **AGP 9.0.1**, **Kotlin 2.4.21**, **Compose BOM 2026.11.01**, **Room 2.8.5**, and **Haze 2.1.0 (`haze-glass` + `haze-blur`)**, featuring a BitChord-inspired iOS 26 Liquid Glass UI overhaul.

            ### What's New
            - **BitChord Liquid Glass Engine**: Real optical `haze-glass` refraction surfaces, specular rim highlights, `hazeGlassContainer` organic pill merging, and progressive Apple-style `TopFadeBlur` scroll-edge frosting.
            - **Dual-Island Floating Pill Dock**: Spring-physics travelling selection pill for Home / Today / Scheduled / All tabs paired with a detached circular Quick-Add orb that morphs smoothly into the NLP capture capsule.
            - **Glass Fidelity Controls**: Switch between *Liquid Glass*, *Lighter Frost*, and *Reduced Blur* directly in Settings.
            - **OLED Obsidian & Crystal Light**: High-contrast monochrome bases paired with animated ambient mesh vibrancy and Apple-tuned tight display typography.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
