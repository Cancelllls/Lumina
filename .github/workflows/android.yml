name: Lumina Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Lint & Build Lumina APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests & Android Lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/lumina-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "KEYSTORE_BASE64 secret not set; using debug signing fallback."
          fi

      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build R8 Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          REL_DIR="app/build/outputs/apk/release"
          DBG_DIR="app/build/outputs/apk/debug"

          if [ -f "$REL_DIR/app-universal-release.apk" ]; then
            cp "$REL_DIR/app-universal-release.apk" release_assets/Lumina-v1.2.0-universal-release.apk
            cp "$REL_DIR/app-universal-release.apk" release_assets/Lumina-release.apk
          elif [ -f "$REL_DIR/app-universal-release-unsigned.apk" ]; then
            cp "$REL_DIR/app-universal-release-unsigned.apk" release_assets/Lumina-v1.2.0-universal-release.apk
            cp "$REL_DIR/app-universal-release-unsigned.apk" release_assets/Lumina-release.apk
          fi

          if [ -f "$REL_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$REL_DIR/app-arm64-v8a-release.apk" release_assets/Lumina-v1.2.0-arm64-v8a-release.apk
          elif [ -f "$REL_DIR/app-arm64-v8a-release-unsigned.apk" ]; then
            cp "$REL_DIR/app-arm64-v8a-release-unsigned.apk" release_assets/Lumina-v1.2.0-arm64-v8a-release.apk
          fi

          if [ -f "$REL_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$REL_DIR/app-armeabi-v7a-release.apk" release_assets/Lumina-v1.2.0-armeabi-v7a-release.apk
          elif [ -f "$REL_DIR/app-armeabi-v7a-release-unsigned.apk" ]; then
            cp "$REL_DIR/app-armeabi-v7a-release-unsigned.apk" release_assets/Lumina-v1.2.0-armeabi-v7a-release.apk
          fi

          if [ -f "$DBG_DIR/app-universal-debug.apk" ]; then
            cp "$DBG_DIR/app-universal-debug.apk" release_assets/Lumina-v1.2.0-debug.apk
            cp "$DBG_DIR/app-universal-debug.apk" release_assets/Lumina-debug.apk
          fi
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumina-Debug-APK
          path: release_assets/Lumina-debug.apk
          retention-days: 14

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumina-Release-APKs
          path: release_assets/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0' }}
          name: "Lumina ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0' }}"
          draft: false
          prerelease: false
          body: |
            ## Lumina v1.2.0 — Flagship Liquid Glass & Production Build

            Production-hardened release with **R8 optimization & resource shrinking**, **per-ABI + universal APKs**, **strict Android Lint gate**, **Room schema export**, **hardware composition haptics**, and **BitChord-matched iOS 26 Liquid Glass UI**.

            ### Highlights
            - **R8 & ABI Splits**: Lean `arm64-v8a`, `armeabi-v7a`, and `universal` APKs with `isMinifyEnabled = true` and `isShrinkResources = true`.
            - **Scroll-Collapsing Dual-Island Dock**: Horizontal drag & lift glass lens pill with cross-boundary tick haptics and scroll-driven inline collapse (`NestedScrollConnection`).
            - **Apple/BitChord Floating Top Bar**: Grouped 44dp frosted action pill (`Search` + `Settings`), scroll-reactive title crossfade, `TopFadeBlur`, and `BottomFadeBlur`.
            - **Hardware Haptics & Launcher Shortcuts**: API 30+ `VibrationEffect.Composition` tactile engine, glass Undo toast pills, reminder duplicate/share actions, Today progress ring, and app launcher shortcuts.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
